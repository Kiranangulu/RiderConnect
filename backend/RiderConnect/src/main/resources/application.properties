
# ==========================================
# RIDERCONNECT APPLICATION CONFIGURATION
# ==========================================

spring.application.name=RiderConnect
server.port=${PORT:8080}

# Load local environment variables
spring.config.import=optional:file:.env[.properties]

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/riderconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA AND HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO
logging.level.com.riderconnect=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# JWT CONFIGURATION
# ==========================================

jwt.secret=${JWT_SECRET}