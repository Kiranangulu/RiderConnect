
# ==========================================
# RIDERCONNECT APPLICATION CONFIGURATION
# ==========================================

spring.application.name=RiderConnect
server.port=8080


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/riderconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root

# Enter your actual MySQL root password
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA AND HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO

logging.level.com.riderconnect=DEBUG

logging.level.org.hibernate.SQL=DEBUG
